<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Tilemap Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at top, rgba(78, 111, 180, 0.28), transparent 35%),
                linear-gradient(135deg, #0a1020 0%, #121f33 52%, #0d1626 100%);
            color: #f2f5fb;
            display: flex;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        .editor-shell {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .panel-glass {
            background: rgba(17, 27, 47, 0.9);
            border: 1px solid rgba(116, 150, 255, 0.22);
            box-shadow: 0 14px 30px rgba(2, 6, 20, 0.42);
            backdrop-filter: blur(10px);
        }

        button, input, select, textarea {
            font: inherit;
        }

        input, select, textarea {
            user-select: text;
        }
        
        .sidebar {
            width: 320px;
            background: rgba(17, 27, 47, 0.94);
            padding: 15px;
            overflow-y: auto;
            border-right: 2px solid rgba(89, 128, 221, 0.32);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
        }

        .hud-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px 18px;
            border-radius: 12px;
            background: linear-gradient(90deg, rgba(10, 16, 32, 0.9), rgba(17, 31, 53, 0.95));
            border: 1px solid rgba(111, 147, 255, 0.24);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
        }

        .hud-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 12px;
            color: #dfe7ff;
        }

        .live-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(31, 212, 146, 0.14);
            border: 1px solid rgba(81, 219, 170, 0.4);
            color: #9ef2c8;
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 11px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .live-pill::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #4af7b1;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(74, 247, 177, 0.9);
        }

        .meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .mini-chip {
            border-radius: 999px;
            background: rgba(101, 128, 197, 0.2);
            border: 1px solid rgba(147, 167, 255, 0.25);
            color: #dfe7ff;
            padding: 5px 10px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .toolbar {
            background: rgba(16, 24, 40, 0.9);
            padding: 10px 15px;
            border-radius: 12px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            border: 1px solid rgba(111, 147, 255, 0.2);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
        }
        
        .editor-container {
            flex: 1;
            display: flex;
            gap: 15px;
            overflow: hidden;
        }
        
        .map-preview {
            flex: 1;
            background: linear-gradient(180deg, #0f1d2f, #0b1220);
            border-radius: 14px;
            overflow: auto;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(105, 139, 255, 0.25);
            box-shadow: inset 0 0 18px rgba(36, 63, 104, 0.5);
        }
        
        .right-panel {
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .tile-palette {
            background: rgba(18, 28, 46, 0.96);
            border-radius: 10px;
            padding: 10px;
            overflow-y: auto;
            flex: 1;
            border: 1px solid rgba(120, 153, 255, 0.2);
        }
        
        .spawn-points {
            background: rgba(18, 28, 46, 0.96);
            border-radius: 10px;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid rgba(120, 153, 255, 0.2);
        }
        
        .control-group {
            margin-bottom: 10px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #e94560;
            font-size: 12px;
        }
        
        input, select, button {
            width: 100%;
            padding: 8px;
            margin-bottom: 5px;
            border: none;
            border-radius: 4px;
            background: #0f3460;
            color: #eee;
            font-size: 13px;
        }
        
        button {
            background: #e94560;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        
        button:hover {
            background: #ff6b6b;
            transform: translateY(-1px);
        }
        
        .tool-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
        
        .tool-buttons button {
            padding: 10px 5px;
            font-size: 16px;
        }
        
        .category-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        
        .category-tab {
            padding: 8px 12px;
            background: #0f3460;
            border: none;
            border-radius: 4px;
            color: #eee;
            cursor: pointer;
            font-size: 12px;
            flex: 1;
            min-width: 60px;
        }
        
        .category-tab.active {
            background: #e94560;
        }
        
        .tile-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 3px;
        }
        
        .tile-item {
            width: 32px;
            height: 32px;
            background: #0f3460;
            border: 2px solid #0f3460;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #aaa;
            border-radius: 4px;
            transition: all 0.2s;
        }
        
        .tile-item:hover {
            border-color: #e94560;
            transform: scale(1.1);
        }
        
        .tile-item.selected {
            border-color: #e94560;
            background: #e94560;
            color: white;
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }
        
        .layer-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            margin-bottom: 5px;
            background: #0f3460;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .layer-item:hover {
            background: #1e3a5f;
        }
        
        .layer-item.active {
            border: 2px solid #e94560;
            background: #1e3a5f;
        }
        
        .layer-item .visibility-toggle {
            cursor: pointer;
            padding: 4px;
        }
        
        .spawn-point-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            margin-bottom: 5px;
            background: #0f3460;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .spawn-point-item .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .status-bar {
            background: rgba(14, 24, 38, 0.98);
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(135, 154, 255, 0.18);
        }
        
        .json-editor {
            width: 100%;
            height: 100px;
            background: rgba(7, 14, 26, 0.94);
            color: #00ff00;
            font-family: 'Courier New', monospace;
            padding: 10px;
            border: 1px solid rgba(116, 154, 255, 0.2);
            border-radius: 10px;
            resize: vertical;
            font-size: 11px;
        }
        
        h2 {
            color: #e94560;
            margin-bottom: 10px;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        h3 {
            color: #eee;
            margin-bottom: 10px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .zoom-controls {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        
        .zoom-controls button {
            width: auto;
            padding: 5px 10px;
        }
        
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }
        
        .action-buttons button {
            font-size: 12px;
            padding: 8px;
        }
        
        .minimap {
            width: 100%;
            height: 150px;
            background: rgba(18, 28, 46, 0.96);
            border-radius: 10px;
            margin-bottom: 10px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(120, 153, 255, 0.2);
        }
        
        .minimap canvas {
            width: 100%;
            height: 100%;
        }
        
        .coordinates {
            background: rgba(11, 16, 28, 0.9);
            padding: 8px;
            border-radius: 999px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            border: 1px solid rgba(122, 154, 255, 0.2);
        }
        
        .responsive-toggle {
            display: none;
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 1000;
            background: linear-gradient(135deg, #e94560, #ff758c);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(233, 69, 96, 0.35);
        }
        
        @media (max-width: 1024px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100%;
                width: min(88vw, 340px);
                z-index: 100;
                transform: translateX(-105%);
                transition: transform 0.25s ease;
                box-shadow: 20px 0 40px rgba(0,0,0,0.35);
            }
            
            .sidebar.open {
                transform: translateX(0);
            }
            
            .responsive-toggle {
                display: block;
            }
            
            .right-panel {
                width: 100%;
                max-height: none;
            }
            
            .tool-buttons {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            body {
                min-height: 100dvh;
            }

            .main-content {
                padding: 10px;
            }

            .toolbar {
                flex-wrap: wrap;
                align-items: center;
                justify-content: space-between;
            }

            .editor-container {
                flex-direction: column;
                min-height: 0;
            }
            
            .right-panel {
                width: 100%;
                max-height: 240px;
            }
            
            .zoom-controls {
                justify-content: center;
                width: 100%;
            }

            .map-preview {
                min-height: 240px;
            }
        }

        @media (max-width: 480px) {
            .toolbar {
                padding: 10px 12px;
            }

            .action-buttons {
                grid-template-columns: 1fr 1fr;
            }

            .tile-grid {
                grid-template-columns: repeat(4, minmax(54px, 1fr));
            }

            .tile-item {
                width: 100%;
                min-height: 56px;
                height: 56px;
            }
        }
        
        .color-preview {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            display: inline-block;
            margin-right: 5px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .tile-counter {
            font-size: 10px;
            color: #888;
            margin-top: 5px;
        }
        
        .shortcut-hint {
            font-size: 10px;
            color: #888;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <button class="responsive-toggle" onclick="toggleSidebar()">☰</button>

    <div class="editor-shell">
        <div class="sidebar panel-glass" id="sidebar">
            <h2>🗺️ World Editor</h2>
            <div class="control-group">
                <label>Harita Boyutu</label>
                <div style="display: flex; gap: 5px;">
                    <input type="number" id="mapWidth" value="64" min="8" max="256" placeholder="Genişlik">
                    <input type="number" id="mapHeight" value="64" min="8" max="256" placeholder="Yükseklik">
                </div>
                <button onclick="resizeMap()">📐 Yeniden Boyutlandır</button>
            </div>

            <div class="control-group">
                <label>Araçlar</label>
                <div class="tool-buttons">
                    <button onclick="setTool('paint')" id="paintTool" title="Boya (B)">🖌️</button>
                    <button onclick="setTool('erase')" id="eraseTool" title="Sil (E)">🧽</button>
                    <button onclick="setTool('fill')" id="fillTool" title="Doldur (F)">🪣</button>
                    <button onclick="setTool('select')" id="selectTool" title="Seç (S)">👆</button>
                    <button onclick="setTool('spawn')" id="spawnTool" title="Spawn (P)">📍</button>
                    <button onclick="setTool('picker')" id="pickerTool" title="Renk Seçici (I)">💉</button>
                    <button onclick="undo()" title="Geri Al (Ctrl+Z)">↩️</button>
                    <button onclick="redo()" title="İleri Al (Ctrl+Y)">↪️</button>
                </div>
                <div class="shortcut-hint">Kısayollar: B-Boya, E-Sil, F-Doldur, S-Seç, P-Spawn, I-Renk</div>
            </div>

            <div class="control-group">
                <label>Geçerli Tile</label>
                <input type="number" id="currentTile" value="1" min="0" max="64">
                <div id="currentTilePreview" class="tile-item selected">1</div>
                <div class="tile-counter" id="tileCounter">Tile: 1/64</div>
            </div>

            <div class="control-group">
                <label>İşlemler</label>
                <div class="action-buttons">
                    <button onclick="clearMap()">🗑️ Temizle</button>
                    <button onclick="clearLayer()">🧹 Katman Temizle</button>
                    <button onclick="exportJSON()">📤 Dışa Aktar</button>
                    <button onclick="importJSON()">📥 İçe Aktar</button>
                    <button onclick="copyToClipboard()">📋 Kopyala</button>
                    <button onclick="loadFromClipboard()">📋 Yükle</button>
                    <button onclick="applyToGame()" style="background: #4CAF50;">🎮 Oyuna Uygula</button>
                    <button onclick="saveToGame()" style="background: #2196F3;">💾 Kaydet</button>
                </div>
            </div>

            <div class="layer-info">
                <h3>📚 Katmanlar</h3>
                <div id="layersList"></div>
                <button onclick="addLayer()">+ Katman Ekle</button>
            </div>

            <div class="status-bar" id="statusBar">
                <span id="statusText">Hazır</span>
                <span id="coordsText">X: 0, Y: 0</span>
            </div>
        </div>

        <div class="main-content">
            <div class="hud-bar panel-glass">
                <div class="hud-title">⚔️ World Builder</div>
                <div class="meta-row">
                    <span class="live-pill">Live sync</span>
                    <span class="mini-chip" id="mapMeta">64x64</span>
                    <span class="mini-chip" id="layerMeta">Layer: ground</span>
                </div>
            </div>

            <div class="toolbar">
                <div class="zoom-controls">
                    <button onclick="zoomIn()">➕</button>
                    <button onclick="zoomOut()">➖</button>
                    <button onclick="resetZoom()">🔄</button>
                    <span id="zoomLevel">100%</span>
                </div>
                <div class="coordinates" id="mouseCoords">
                    X: 0, Y: 0
                </div>
            </div>

            <div class="editor-container">
                <div class="map-preview" id="mapPreview">
                    <canvas id="mapCanvas"></canvas>
                </div>

                <div class="right-panel">
                    <div class="minimap">
                        <h3>🗺️ Minimap</h3>
                        <canvas id="minimapCanvas"></canvas>
                    </div>

                    <div class="spawn-points">
                        <h3>📍 Spawn Noktaları</h3>
                        <div id="spawnPointsList"></div>
                        <button onclick="addSpawnPoint()">+ Spawn Ekle</button>
                    </div>

                    <div class="tile-palette">
                        <h3>🎨 Tile Paleti</h3>
                        <div class="category-tabs" id="categoryTabs"></div>
                        <div class="tile-grid" id="tilePalette"></div>
                        <div class="tile-counter" id="paletteCounter">Toplam: 0 tiles</div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <label>JSON Verisi</label>
                <textarea class="json-editor" id="jsonEditor" spellcheck="false"></textarea>
                <button onclick="applyJSON()">JSON'i Uygula</button>
            </div>
        </div>
    </div>

    <script>
        // Tilemap Editor State
        let tilemapData = {
            width: 64,
            height: 64,
            tileSize: 32,
            layers: [
                {
                    name: "ground",
                    data: Array(64 * 64).fill(1),
                    visible: true,
                    opacity: 1
                },
                {
                    name: "decoration",
                    data: Array(64 * 64).fill(0),
                    visible: true,
                    opacity: 1
                }
            ]
        };
        
        let currentTool = 'paint';
        let currentLayer = 0;
        let isDrawing = false;
        let lastDrawPosition = null;
        let zoomLevel = 1;
        let liveSyncTimer = null;
        const undoStack = [];
        const redoStack = [];
        let isRestoringHistory = false;
        const MIN_ZOOM = 0.6;
        const MAX_ZOOM = 2.4;
        
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        
        // Initialize
        function init() {
            // Load from localStorage if available
            const savedData = localStorage.getItem('tilemapData');
            if (savedData) {
                try {
                    tilemapData = normalizeEditorTilemapData(JSON.parse(savedData));
                    document.getElementById('mapWidth').value = tilemapData.width;
                    document.getElementById('mapHeight').value = tilemapData.height;
                    updateStatus('Kaydedilen harita yüklendi');
                } catch (error) {
                    console.error('Kaydedilen veri yüklenemedi:', error);
                }
            }
            
            zoomLevel = 1;
            setupCanvas();
            renderTilePalette();
            renderLayersList();
            renderMap();
            updateJSON();
            setupEventListeners();
        }

        function normalizeEditorTilemapData(rawData) {
            if (!rawData || !Array.isArray(rawData.layers)) {
                throw new Error('Geçersiz tilemap kaydı: layers gerekli.');
            }

            const width = Number(rawData.width);
            const height = Number(rawData.height);
            if (!Number.isInteger(width) || !Number.isInteger(height) || width < 1 || height < 1) {
                throw new Error('Geçersiz tilemap boyutu.');
            }

            return {
                ...rawData,
                version: 2,
                width,
                height,
                tileSize: Number(rawData.tileSize) || 32,
                layers: rawData.layers.length ? rawData.layers.map((layer, index) => {
                    const sourceData = Array.isArray(layer.data) && layer.data.length && Array.isArray(layer.data[0])
                        ? layer.data.flat()
                        : Array.isArray(layer.data) ? layer.data : [];
                    const data = Array(width * height).fill(0);
                    for (let position = 0; position < Math.min(sourceData.length, data.length); position += 1) {
                        const tile = sourceData[position];
                        data[position] = tile && typeof tile === 'object' && 'index' in tile
                            ? Number(tile.index) || 0
                            : Number(tile) || 0;
                    }
                    return {
                        ...layer,
                        name: layer.name || `layer_${index}`,
                        data,
                        visible: layer.visible !== false,
                        opacity: Number.isFinite(Number(layer.opacity)) ? Number(layer.opacity) : 1
                    };
                }) : [{
                    name: 'ground',
                    data: Array(width * height).fill(0),
                    visible: true,
                    opacity: 1
                }],
                spawnPoints: Array.isArray(rawData.spawnPoints) ? rawData.spawnPoints.map((spawn, index) => ({
                    x: Math.max(0, Math.min(width - 1, Number(spawn.x) || 0)),
                    y: Math.max(0, Math.min(height - 1, Number(spawn.y) || 0)),
                    name: spawn.name || `spawn_${index + 1}`
                })) : []
            };
        }
        
        function setupCanvas() {
            const baseWidth = tilemapData.width * tilemapData.tileSize;
            const baseHeight = tilemapData.height * tilemapData.tileSize;
            canvas.width = baseWidth;
            canvas.height = baseHeight;
            const displayWidth = Math.max(32, Math.round(baseWidth * zoomLevel));
            const displayHeight = Math.max(32, Math.round(baseHeight * zoomLevel));
            canvas.style.width = `${displayWidth}px`;
            canvas.style.height = `${displayHeight}px`;
            canvas.style.imageRendering = 'pixelated';
            canvas.style.touchAction = 'none';
            document.getElementById('zoomLevel').textContent = `${Math.round(zoomLevel * 100)}%`;
            updateMapMeta();
        }

        function updateMapMeta() {
            const mapMeta = document.getElementById('mapMeta');
            const layerMeta = document.getElementById('layerMeta');
            if (mapMeta) {
                mapMeta.textContent = `${tilemapData.width}x${tilemapData.height}`;
            }
            if (layerMeta && tilemapData.layers[currentLayer]) {
                layerMeta.textContent = `Layer: ${tilemapData.layers[currentLayer].name}`;
            }
        }

        function broadcastMapUpdate({ silent = false } = {}) {
            const snapshot = JSON.stringify(tilemapData);
            localStorage.setItem('tilemapData', snapshot);

            try {
                if (window.opener && !window.opener.closed) {
                    window.opener.postMessage({ type: 'tilemapUpdate', tilemapData }, '*');
                    if (!silent) {
                        updateStatus('Canlı önizleme güncellendi');
                    }
                } else if (!silent) {
                    updateStatus('Harita yerelde kaydedildi');
                }
            } catch (error) {
                console.warn('Live sync failed:', error);
            }
        }

        function scheduleLiveSync() {
            clearTimeout(liveSyncTimer);
            liveSyncTimer = setTimeout(() => {
                broadcastMapUpdate({ silent: true });
            }, 120);
        }

        function zoomIn() {
            zoomLevel = Math.min(MAX_ZOOM, Number((zoomLevel + 0.1).toFixed(2)));
            setupCanvas();
        }

        function zoomOut() {
            zoomLevel = Math.max(MIN_ZOOM, Number((zoomLevel - 0.1).toFixed(2)));
            setupCanvas();
        }

        function resetZoom() {
            zoomLevel = 1;
            setupCanvas();
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (!sidebar) return;
            sidebar.classList.toggle('open');
        }
        
        function renderTilePalette() {
            const palette = document.getElementById('tilePalette');
            palette.innerHTML = '';

        function renderLayersList() {
            const layersList = document.getElementById('layersList');
            layersList.innerHTML = '';
            
            tilemapData.layers.forEach((layer, index) => {
                const layerItem = document.createElement('div');
                layerItem.className = 'layer-item' + (index === currentLayer ? ' active' : '');
                layerItem.innerHTML = `
                    <span>

                        ${layer.name}
                    </span>

                `;
                layerItem.onclick = (e) => {

        function selectLayer(index) {
            currentLayer = index;
            renderLayersList();
            renderMap();
            updateMapMeta();
            updateStatus(`Katman: ${tilemapData.layers[index].name}`);
        }

        function createSnapshot() {
            return JSON.stringify({ tilemapData, currentLayer });
        }

        function restoreSnapshot(snapshot) {
            const restored = JSON.parse(snapshot);
            tilemapData = restored.tilemapData;
            currentLayer = Math.min(restored.currentLayer, tilemapData.layers.length - 1);
            document.getElementById('mapWidth').value = tilemapData.width;
            document.getElementById('mapHeight').value = tilemapData.height;
            setupCanvas();
            renderLayersList();
            renderMap();
            updateJSON();
            broadcastMapUpdate({ silent: true });
        }

        function recordHistory() {
            if (isRestoringHistory) return;
            const snapshot = createSnapshot();
            if (undoStack[undoStack.length - 1] !== snapshot) {
                undoStack.push(snapshot);
                if (undoStack.length > 40) undoStack.shift();
            }
            redoStack.length = 0;
        }
        
        function toggleLayerVisibility(index) {
            recordHistory();
            tilemapData.layers[index].visible = !tilemapData.layers[index].visible;
            renderMap();
            updateJSON();
            scheduleLiveSync();
        }
        
        function addLayer() {
            const name = prompt('Katman adı:', `layer_${tilemapData.layers.length}`);
            if (name) {
                recordHistory();
                tilemapData.layers.push({
                    name: name,
                    data: Array(tilemapData.width * tilemapData.height).fill(0),
                    visible: true,
                    opacity: 1
                });
                renderLayersList();
                updateMapMeta();
                updateJSON();
            }
        }
        
        function removeLayer(index) {
            if (tilemapData.layers.length > 1) {
                recordHistory();
                tilemapData.layers.splice(index, 1);
                if (currentLayer >= tilemapData.layers.length) {
                    currentLayer = tilemapData.layers.length - 1;
                }
                renderLayersList();
                renderMap();
                updateMapMeta();
                updateJSON();
            }
        }
        
        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-buttons button').forEach(btn => {
                btn.style.background = '#e94560';
                btn.classList.remove('active');
            });
            const activeButton = document.getElementById(tool + 'Tool');
            if (activeButton) {
                activeButton.style.background = '#ff6b6b';
                activeButton.classList.add('active');
            }
            updateStatus(`Araç: ${tool}`);
        }
        
        function clearLayer() {
            const layer = tilemapData.layers[currentLayer];
            if (!layer) return;
            recordHistory();
            layer.data = Array(tilemapData.width * tilemapData.height).fill(0);
            renderMap();
            updateJSON();
            scheduleLiveSync();
            updateStatus(`Katman temizlendi: ${layer.name}`);
        }
        
        function undo() {
            if (!undoStack.length) {
                updateStatus('Geri alınacak işlem yok');
                return;
            }
            redoStack.push(createSnapshot());
            isRestoringHistory = true;
            restoreSnapshot(undoStack.pop());
            isRestoringHistory = false;
            updateStatus('Son işlem geri alındı');
        }
        
        function redo() {
            if (!redoStack.length) {
                updateStatus('İleri alınacak işlem yok');
                return;
            }
            undoStack.push(createSnapshot());
            isRestoringHistory = true;
            restoreSnapshot(redoStack.pop());
            isRestoringHistory = false;
            updateStatus('İşlem yeniden uygulandı');
        }
        
        function addSpawnPoint() {
            const x = Number(prompt('Spawn X koordinatı:', '10')) || 0;
            const y = Number(prompt('Spawn Y koordinatı:', '10')) || 0;
            if (!Number.isFinite(x) || !Number.isFinite(y)) {
                return;
            }
            recordHistory();
            const existing = Array.isArray(tilemapData.spawnPoints) ? tilemapData.spawnPoints : [];
            tilemapData.spawnPoints = [...existing, { x, y, name: `spawn_${existing.length + 1}` }];
            updateJSON();
            renderMap();
            scheduleLiveSync();
            updateStatus(`Spawn eklendi: ${x}, ${y}`);
        }

        function renderSpawnPoints() {
            const list = document.getElementById('spawnPointsList');
            if (!list) return;
            const spawnPoints = Array.isArray(tilemapData.spawnPoints) ? tilemapData.spawnPoints : [];
            list.innerHTML = '';
            if (!spawnPoints.length) {
                list.innerHTML = '<div class="tile-counter">Henüz spawn noktası yok.</div>';

        function removeSpawnPoint(index) {
            const spawnPoints = Array.isArray(tilemapData.spawnPoints) ? tilemapData.spawnPoints : [];
            if (!spawnPoints[index]) return;
            recordHistory();
            tilemapData.spawnPoints = spawnPoints.filter((_, pointIndex) => pointIndex !== index);
            renderSpawnPoints();
            renderMap();
            updateJSON();
            scheduleLiveSync();
            updateStatus('Spawn noktası silindi');
        }
        
        function resizeMap() {
            const newWidth = parseInt(document.getElementById('mapWidth').value);
            const newHeight = parseInt(document.getElementById('mapHeight').value);
            if (!Number.isInteger(newWidth) || !Number.isInteger(newHeight) || newWidth < 8 || newHeight < 8) {
                updateStatus('Harita boyutu 8 ile 256 arasında olmalı');
                return;
            }
            recordHistory();
            
            tilemapData.layers.forEach(layer => {
                const newData = Array(newWidth * newHeight).fill(0);
                
                for (let y = 0; y < Math.min(tilemapData.height, newHeight); y++) {
                    for (let x = 0; x < Math.min(tilemapData.width, newWidth); x++) {
                        const oldIndex = y * tilemapData.width + x;
                        const newIndex = y * newWidth + x;
                        newData[newIndex] = layer.data[oldIndex];
                    }
                }
                
                layer.data = newData;
            });
            
            tilemapData.width = newWidth;
            tilemapData.height = newHeight;
            
            setupCanvas();
            renderMap();
            updateMapMeta();
            updateJSON();
            scheduleLiveSync();
            updateStatus(`Harita boyutu: ${newWidth}x${newHeight}`);
        }
        
        function clearMap() {
            if (confirm('Tüm harita temizlensin mi?')) {
                recordHistory();
                tilemapData.layers[currentLayer].data = Array(tilemapData.width * tilemapData.height).fill(0);
                renderMap();
                updateJSON();
                scheduleLiveSync();
                updateStatus('Harita temizlendi');
            }
        }
        
        function renderMap() {
            ctx.fillStyle = '#0f3460';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Render each layer
            tilemapData.layers.forEach((layer, layerIndex) => {
                if (!layer.visible) return;
                ctx.globalAlpha = Number(layer.opacity) || 1;
                
                for (let y = 0; y < tilemapData.height; y++) {
                    for (let x = 0; x < tilemapData.width; x++) {
                        const index = y * tilemapData.width + x;
                        const tileId = layer.data[index];
                        
                        if (tileId > 0) {
                            ctx.fillStyle = getTileColor(tileId);
                            ctx.fillRect(
                                x * tilemapData.tileSize,
                                y * tilemapData.tileSize,
                                tilemapData.tileSize,
                                tilemapData.tileSize
                            );
                            
                            // Add tile number
                            ctx.fillStyle = tileId > 32 ? '#000' : '#fff';
                            ctx.font = '10px Arial';
                            ctx.fillText(
                                tileId,
                                x * tilemapData.tileSize + 4,
                                y * tilemapData.tileSize + 12
                            );
                        }
                    }
                }
            });
            
            // Draw grid
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            
            for (let x = 0; x <= tilemapData.width; x++) {
                ctx.beginPath();
                ctx.moveTo(x * tilemapData.tileSize, 0);
                ctx.lineTo(x * tilemapData.tileSize, canvas.height);
                ctx.stroke();
            }
            
            for (let y = 0; y <= tilemapData.height; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * tilemapData.tileSize);
                ctx.lineTo(canvas.width, y * tilemapData.tileSize);
                ctx.stroke();
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.38)';
            ctx.strokeRect(0.5, 0.5, canvas.width - 1, canvas.height - 1);
            ctx.globalAlpha = 1;
            renderMinimap();
        }

        function renderMinimap() {
            const minimap = document.getElementById('minimapCanvas');
            if (!minimap) return;
            const width = minimap.clientWidth || 240;
            const height = minimap.clientHeight || 130;
            const minimapContext = minimap.getContext('2d');
            minimap.width = width;
            minimap.height = height;
            minimapContext.fillStyle = '#0a1422';
            minimapContext.fillRect(0, 0, width, height);
            const cellWidth = width / tilemapData.width;
            const cellHeight = height / tilemapData.height;
            tilemapData.layers.forEach((layer) => {
                if (!layer.visible) return;
                minimapContext.globalAlpha = Number(layer.opacity) || 1;
                layer.data.forEach((tileId, index) => {
                    if (!tileId) return;
                    const x = index % tilemapData.width;
                    const y = Math.floor(index / tilemapData.width);
                    minimapContext.fillStyle = getTileColor(tileId);
                    minimapContext.fillRect(x * cellWidth, y * cellHeight, Math.ceil(cellWidth), Math.ceil(cellHeight));
                });
            });
            minimapContext.globalAlpha = 1;
            (tilemapData.spawnPoints || []).forEach((spawn) => {
                minimapContext.fillStyle = '#ffe08a';
                minimapContext.fillRect(spawn.x * cellWidth - 1, spawn.y * cellHeight - 1, 3, 3);
            });
        }
        
        function getTileAtPosition(x, y) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const canvasX = (x - rect.left) * scaleX;
            const canvasY = (y - rect.top) * scaleY;
            
            const tileX = Math.floor(canvasX / tilemapData.tileSize);
            const tileY = Math.floor(canvasY / tilemapData.tileSize);
            
            if (tileX >= 0 && tileX < tilemapData.width && tileY >= 0 && tileY < tilemapData.height) {
                return { x: tileX, y: tileY };
            }
            return null;
        }
        
        function paintTile(tileX, tileY) {
            const index = tileY * tilemapData.width + tileX;
            const currentTileValue = parseInt(document.getElementById('currentTile').value);

            if (currentTool === 'picker' || currentTool === 'select') {
                const selectedTile = tilemapData.layers[currentLayer].data[index] || 0;
                selectTile(selectedTile);
                updateStatus(`Tile ${selectedTile} seçildi (${tileX}, ${tileY})`);
                return;
            }

            if (currentTool === 'spawn') {
                recordHistory();
                const existing = Array.isArray(tilemapData.spawnPoints) ? tilemapData.spawnPoints : [];
                tilemapData.spawnPoints = [...existing, { x: tileX, y: tileY, name: `spawn_${existing.length + 1}` }];
                renderMap();
                updateJSON();
                scheduleLiveSync();
                updateStatus(`Spawn eklendi: ${tileX}, ${tileY}`);
                return;
            }

            if (tilemapData.layers[currentLayer].data[index] === currentTileValue && currentTool === 'paint') return;
            recordHistory();
            
            if (currentTool === 'paint') {
                tilemapData.layers[currentLayer].data[index] = currentTileValue;
            } else if (currentTool === 'erase') {
                tilemapData.layers[currentLayer].data[index] = 0;
            }
            
            renderMap();
            updateJSON();
            scheduleLiveSync();
        }
        
        function fillTile(startX, startY) {
            const currentTileValue = parseInt(document.getElementById('currentTile').value);
            const layer = tilemapData.layers[currentLayer];
            const startIndex = startY * tilemapData.width + startX;
            const targetTile = layer.data[startIndex];
            
            if (targetTile === currentTileValue) return;
            recordHistory();
            
            const stack = [[startX, startY]];
            const visited = new Set();
            
            while (stack.length > 0) {
                const [x, y] = stack.pop();
                const key = `${x},${y}`;
                
                if (visited.has(key)) continue;
                if (x < 0 || x >= tilemapData.width || y < 0 || y >= tilemapData.height) continue;
                
                const index = y * tilemapData.width + x;
                if (layer.data[index] !== targetTile) continue;
                
                visited.add(key);
                layer.data[index] = currentTileValue;
                
                stack.push([x + 1, y]);
                stack.push([x - 1, y]);
                stack.push([x, y + 1]);
                stack.push([x, y - 1]);
            }
            
            renderMap();
            updateJSON();
            scheduleLiveSync();
        }
        
        function setupEventListeners() {
            canvas.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                isDrawing = true;
                canvas.setPointerCapture?.(e.pointerId);
                const pos = getTileAtPosition(e.clientX, e.clientY);
                if (pos) {
                    if (currentTool === 'fill') {
                        fillTile(pos.x, pos.y);
                    } else {
                        paintTile(pos.x, pos.y);
                    }
                    lastDrawPosition = pos;
                }
            });
            
            canvas.addEventListener('pointermove', (e) => {
                const pos = getTileAtPosition(e.clientX, e.clientY);
                if (pos) updateCoordinates(pos);
                if (!isDrawing) return;
                e.preventDefault();
                if (pos && (pos.x !== lastDrawPosition?.x || pos.y !== lastDrawPosition?.y)) {
                    if (currentTool !== 'fill') {
                        paintTile(pos.x, pos.y);
                    }
                    lastDrawPosition = pos;
                }
            });
            
            canvas.addEventListener('pointerup', () => {
                isDrawing = false;
                lastDrawPosition = null;
            });
            
            canvas.addEventListener('pointercancel', () => {
                isDrawing = false;
                lastDrawPosition = null;
            });
            
            canvas.addEventListener('pointerleave', () => {
                isDrawing = false;
                lastDrawPosition = null;
            });

            canvas.addEventListener('wheel', (e) => {
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    if (e.deltaY < 0) {
                        zoomIn();
                    } else {
                        zoomOut();
                    }
                }
            }, { passive: false });
            
            document.getElementById('currentTile').addEventListener('change', (e) => {
                selectTile(parseInt(e.target.value));
            });

            document.addEventListener('keydown', (e) => {
                if (e.target.matches('input, textarea')) return;
                const key = e.key.toLowerCase();
                if ((e.ctrlKey || e.metaKey) && key === 'z') {
                    e.preventDefault();
                    e.shiftKey ? redo() : undo();
                } else if ((e.ctrlKey || e.metaKey) && key === 'y') {
                    e.preventDefault();
                    redo();
                } else if (key === 'b') setTool('paint');
                else if (key === 'e') setTool('erase');
                else if (key === 'f') setTool('fill');
                else if (key === 'i') setTool('picker');
                else if (key === 'p') setTool('spawn');
                else if (key === 's') setTool('select');
            });

            document.querySelector('.map-preview').addEventListener('touchmove', (e) => {
                if (e.target === canvas) {
                    e.preventDefault();
                }
            }, { passive: false });
        }

        function updateCoordinates(pos) {
            const value = `X: ${pos.x}, Y: ${pos.y}`;
            const mouseCoords = document.getElementById('mouseCoords');
            const coordsText = document.getElementById('coordsText');
            if (mouseCoords) mouseCoords.textContent = value;
            if (coordsText) coordsText.textContent = value;
        }
        
        function updateJSON() {
            document.getElementById('jsonEditor').value = JSON.stringify(tilemapData, null, 2);
            localStorage.setItem('tilemapData', JSON.stringify(tilemapData));
            updateMapMeta();
            renderSpawnPoints();
        }
        
        function applyJSON() {
            try {
                const raw = document.getElementById('jsonEditor').value;
                const newData = normalizeEditorTilemapData(JSON.parse(raw));

                recordHistory();
                tilemapData = newData;
                currentLayer = Math.min(currentLayer, tilemapData.layers.length - 1);
                setupCanvas();
                renderLayersList();
                renderMap();
                updateMapMeta();
                updateJSON();
                broadcastMapUpdate({ silent: false });
                updateStatus('JSON uygulandı');
            } catch (error) {
                updateStatus('JSON hatası: ' + error.message);
            }
        }
        
        function applyToGame() {
            localStorage.setItem('tilemapData', JSON.stringify(tilemapData));
            broadcastMapUpdate({ silent: false });

            if (window.opener) {
                window.opener.postMessage({
                    type: 'tilemapUpdate',
                    tilemapData: tilemapData
                }, '*');
                window.opener.focus();
                updateStatus('Tilemap verileri oyuna gönderildi!');
                return;
            }

            const existingGame = window.open('http://127.0.0.1:4173', 'GamePreview');
            if (existingGame) {
                existingGame.focus();
                updateStatus('Oyun önizleme penceresi açıldı!');
                return;
            }

            updateStatus('Oyun penceresi bulunamadı, veriler yerel olarak kaydedildi.');
        }
        
        function saveToGame() {
            // Save tilemap data to a file for the game to load
            const dataStr = JSON.stringify(tilemapData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = 'tilemap-data.json';
            link.click();
            
            URL.revokeObjectURL(url);
            updateStatus('Tilemap verileri dosyaya kaydedildi - public/assets/tilemap-data.json olarak kopyalayın');
        }
        
        function exportJSON() {
            const dataStr = JSON.stringify(tilemapData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = 'tilemap.json';
            link.click();
            
            URL.revokeObjectURL(url);
            updateStatus('JSON dışa aktarıldı');
        }
        
        function importJSON() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                
                reader.onload = (event) => {
                    try {
                        recordHistory();
                        tilemapData = normalizeEditorTilemapData(JSON.parse(event.target.result));
                        setupCanvas();
                        renderLayersList();
                        renderMap();
                        updateJSON();
                        updateStatus('JSON içe aktarıldı');
                    } catch (error) {
                        updateStatus('JSON içe aktarma hatası: ' + error.message);
                    }
                };
                
                reader.readAsText(file);
            };
            
            input.click();
        }
        
        function copyToClipboard() {
            navigator.clipboard.writeText(JSON.stringify(tilemapData, null, 2));
            updateStatus('JSON panoya kopyalandı');
        }

                    tilemapData = normalizeEditorTilemapData(JSON.parse(text));
                    setupCanvas();
                    renderLayersList();
                    renderMap();
                    updateJSON();
                    updateStatus('JSON panodan yüklendi');
                } catch (error) {
                    updateStatus('Panodan yükleme hatası: ' + error.message);
                }
            });
        }
        
        function updateStatus(message) {
            const statusBar = document.getElementById('statusBar');
            if (!statusBar) return;
            statusBar.innerHTML = `<span id="statusText">${message}</span><span id="coordsText">X: 0, Y: 0</span>`;
        }
        
        // Initialize on load
        window.onload = init;
    </script>
</body>
</html>
